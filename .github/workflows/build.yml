name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      # 上架/分发用：release 包（同一个固定签名，后面更新才能覆盖安装）
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk-debug
          path: app/build/outputs/apk/debug/*.apk
